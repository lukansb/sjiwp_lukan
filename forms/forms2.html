<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>
    <form action="#" method="get">
      <label for="roll">Roll.no:</label>
      <input type="text" name="roll" id="roll" /> <br />
      <label for="name">Student Name:</label>
      <input type="text" name="name" id="name" placeholder="First Name" />
      <label>-</label>
      <input type="text" name="name" id="name" placeholder="Last Name" /> <br />
      <label for="father">Fathers Name:</label>
      <input type="text" name="father" id="father" /> <br />
      <label for="birth">Date of Birth:</label>
      <input type="date" name="birth" id="birth" /> <br />
      <label for="phone">Mobile no:</label>
      <input type="tel" name="phone" id="phone" /> <br />
      <label for="email">Email id:</label>
      <input type="email" name="email" id="email" /> <br />
      <label for="pass">Password:</label>
      <input type="password" name="pass" id="pass" /> <br />
      <label for="gender">Gender:</label>
      <input type="radio" name="gender" id="male" value="Male" />
      <label for="male">Male</label>
      <input type="radio" name="gender" id="female" value="Female" />
      <label for="female">Female</label> <br />
      <label for="dep">Department:</label>
      <input type="checkbox" name="dep1" id="cse" value="CSE" />
      <label for="cse">CSE</label>
      <input type="checkbox" name="dep2" id="it" value="IT" />
      <label for="it">IT</label>
      <input type="checkbox" name="dep3" id="ece" value="ECE" />
      <label for="ece">ECE</label>
      <input type="checkbox" name="dep4" id="civil" value="Civil" />
      <label for="civil">Civil</label>
      <input type="checkbox" name="dep5" id="mech" value="Mech" />
      <label for="mech">Mech</label> <br />
      <label for="course">Course:</label>
      <select name="course" id="course" placeholder="Select Course">
        <option value="racunalstvo">Racunalstvo</option>
        <option value="mehatronika">Mehatronika</option>
        <option value="strojarstvo">Strojarstvo</option>
        <option value="elektrotehnika">Elektrotehnika</option>
      </select>
      <br />
      <label for="photo">Student Photo:</label>
      <input type="file" name="photo" id="photo" /> <br />
      <label for="city">City:</label>
      <input type="text" name="city" id="city" /> <br />
      <label for="adress">Adress:</label>
      <textarea name="adress" id="adress" cols="30" rows="5"></textarea> <br />
      <input type="submit" value="Register" />
    </form>
  </body>
</html>
